<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI untuk Linda Practice Speaking</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>

<nav style="
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.3); /* Dark charcoal with transparency */
    backdrop-filter: blur(10px); /* Glassmorphism blur effect */
    padding: 1rem 5%;
    border-bottom: 1px solid rgba(255, 255, 255, 0.3); /* Subtle light border */
    position: sticky;
    top: 0;
    z-index: 1000;">
        
        <ul style="
        list-style: none;
        display: flex;
        gap: 2rem;">
            <a href="https://angga-labola.github.io/index.html"
                style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Home</a>
            <a href="https://angga-labola.github.io/creeds.html"
            style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Creeds</a>
            <a href="https://angga-labola.github.io/articles.html"
            style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Articles</a>
            <a href="https://angga-labola.github.io/apps.html"
            style="
                 text-decoration: none;
                 color : #73613c;
                 font-size: 1rem;
                 transition: color 0.3s ease;">Apps</a>
        </ul>
        
</nav>

    <div class="container">
      <header>
        <h1>AI untuk Linda Practice Speaking</h1>
        <div style="display: flex; gap: 10px; align-items: center">
          <div id="status" class="status disconnected">Disconnected</div>
          <div id="interaction-status" class="interaction-status hidden"></div>
        </div>
      </header>

      <main>
        <div class="auth-section" id="auth-section">
          
          <p>Click below to connect.</p>
          <button id="connectBtn" class="btn">Connect</button>
        </div>

        <div class="session-end-section hidden" id="session-end-section">
          <h2>Session Ended</h2>
          <button id="restartBtn" class="btn">Start New Session</button>
        </div>

        <div class="app-section hidden" id="app-section">
          <div class="app-grid">
            <div class="left-panel">
              <div class="video-container">
                <div id="video-placeholder">Start camera to send video</div>
                <video id="video-preview" autoplay playsinline muted></video>
                <canvas id="video-canvas" style="display: none"></canvas>
              </div>

              <div class="controls">
                <button id="micBtn" class="btn icon-btn">Start Mic</button>
                <button id="cameraBtn" class="btn icon-btn">
                  Start Camera
                </button>
                <button id="screenBtn" class="btn icon-btn">
                  Share Screen
                </button>
                <button id="disconnectBtn" class="btn icon-btn danger">
                  Disconnect
                </button>
              </div>
            </div>

            <div class="right-panel">
              <div class="chat-log" id="chat-log"></div>
              <div class="input-area">
                <input
                  type="text"
                  id="textInput"
                  placeholder="Type a message..."
                />
                <button id="sendBtn" class="btn">Send</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/static/media-handler.js"></script>
    <script src="/static/gemini-client.js"></script>
    <script src="/static/main.js"></script>
  </body>
</html>
